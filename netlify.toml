[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Guides change several times a day. Never let a stale page stick.
[[headers]]
  for = "/dungeons/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/raids/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Internal files. publish = "." deploys the whole repository, so everything
# below would otherwise be readable on the live site. Netlify serves a real
# file in preference to a redirect rule, so each of these needs force = true
# — without it the rule is silently ignored for paths that exist on disk.
[[redirects]]
  from = "/_build/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/state/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/HANDOFF.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/START-HERE.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/build.sh"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/site.config.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/sky"
  to = "/tools/plane-of-sky.html"
  status = 301
[[redirects]]
  from = "/races"
  to = "/tools/race-unlocks.html"
  status = 301
[[redirects]]
  from = "/calculator"
  to = "/tools/combo-calculator.html"
  status = 301
