[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Guides change several times a day. Never let a stale page stick.
[[headers]]
  for = "/dungeons/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/raids/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The twelve force-404 rules that used to live here are gone. They existed
# only because publish = "." deployed the entire repository, so every
# internal directory had to be blacklisted by hand and a forgotten one was
# published. public/ contains nothing internal, so there is nothing to hide.

[[redirects]]
  from = "/sky"
  to = "/tools/plane-of-sky.html"
  status = 301
[[redirects]]
  from = "/races"
  to = "/tools/race-unlocks.html"
  status = 301
[[redirects]]
  from = "/calculator"
  to = "/tools/combo-calculator.html"
  status = 301

# The campaign plate was withdrawn. It had been published and indexed, so
# send its old URL to the dungeon index rather than leaving a dead end.
[[redirects]]
  from = "/dungeons/campaign-10-to-50.html"
  to = "/dungeons/index.html"
  status = 301
  force = true
